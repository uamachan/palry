name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://palry.renr211215.workers.dev
          # Firebase の Web 設定は秘密情報ではなく（クライアントバンドルに必ず露出する）、
          # 既に .env.example にコミット済みの公開値。GitHub シークレット未登録でも
          # ログインが壊れないよう、ここに直接指定する。
          VITE_FIREBASE_API_KEY: AIzaSyBS0H86DfjnkFs41PAZGIdt7k45AvN67CY
          VITE_FIREBASE_AUTH_DOMAIN: ren12-9388b.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ren12-9388b
          VITE_FIREBASE_STORAGE_BUCKET: ren12-9388b.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "30141729313"
          VITE_FIREBASE_APP_ID: "1:30141729313:web:29a4f35bbbf2a7a634b160"
          VITE_FIREBASE_MEASUREMENT_ID: G-D6LP75EC9F
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          # 正式名 CLOUDFLARE_API_TOKEN を優先。未登録時は別名 SEVERE で登録された値を使う。
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.SEVERE }}
          workingDirectory: "."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.SEVERE }}
          # アカウントIDを直接指定。スコープ付きトークンが /memberships を
          # 取得できず認証エラー(code 10000)になるのを回避する。
          # アカウントIDは秘密情報ではない公開識別子。
          CLOUDFLARE_ACCOUNT_ID: fbd1e4ffbd25e9e55243147a97784315
